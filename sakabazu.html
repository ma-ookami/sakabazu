<section class="sheet" id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="dName">
  <div class="sheet-in">
    <div class="sheet-head">
      <button class="back" id="dBack"><b>‹</b>戻る</button>
      <button class="more-btn d-more" id="dMore" type="button" aria-label="このお店の操作">…</button>
    </div>
    <div class="d-card">
      <div class="d-top">
        <h2 class="d-name" id="dName"></h2>
        <div class="seg d-seg" id="dSeg" role="group" aria-label="ステータス">
          <button data-s="want">行きたい</button><button data-s="went">行った</button>
        </div>
      </div>
      <div id="dInfo"></div>
    </div>
    <div id="dBody"></div>
  </div>
</section>

<section class="sheet" id="formSheet" hidden role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="sheet-in">
    <div class="sheet-head"><button class="back" id="fBack"><b>‹</b>戻る</button></div>
    <h2 class="d-name" id="fTitle">お店の情報を編集</h2>
    <form class="form" id="form" novalidate>
      <label for="fName">店名</label>
      <input id="fName" class="field" required maxlength="60" autocomplete="off">
      <label for="fArea">エリア・最寄り駅</label>
      <input id="fArea" class="field" maxlength="40" placeholder="例: 駅前の路地裏" autocomplete="off">
      <label for="fGenre">ジャンル</label>
      <input id="fGenre" class="field" maxlength="20" placeholder="例: 居酒屋、ラーメン" autocomplete="off">
      <div class="chips g-chips" id="fGenres" role="group" aria-label="ジャンルを選ぶ"></div>
      <label for="fOpen">営業時間</label>
      <div class="hrow"><input id="fOpen" type="time" class="dateinput" aria-label="開店時間"><span>〜</span><input id="fClose" type="time" class="dateinput" aria-label="閉店時間"></div>
      <p class="hint fhint">深夜まで営業している店は、閉店に「2:00」のように翌日の時刻を入れてください。</p>
      <label>定休日</label>
      <div class="wdays" id="fDays" role="group" aria-label="定休日"></div>
      <label for="fHNote">営業時間のメモ</label>
      <input id="fHNote" class="field" maxlength="60" placeholder="例: 日曜は22時まで、ランチ営業あり" autocomplete="off">
      <label>お店のリンク</label>
      <div id="fLinks"></div>
      <button type="button" class="textbtn" id="fAddLink">＋ リンクを追加</button>
      <div class="actions">
        <button type="submit" class="btn btn-red">保存する</button>
        <button type="button" class="btn btn-line" id="fCancel">やめる</button>
      </div>
    </form>
  </div>
</section>

<section class="sheet" id="pickSheet" hidden role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="sheet-in">
    <div class="sheet-head"><button class="back" id="pBack"><b>‹</b>戻る</button></div>
    <h2 class="d-name" id="pTitle">今日どこ行く?</h2>
    <div class="p-who" id="pWho" hidden></div>
    <div id="pBody"></div>
  </div>
</section>

<section class="sheet" id="searchSheet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="sheet-in">
    <div class="sheet-head"><button class="back" id="sBack"><b>‹</b>戻る</button></div>
    <h2 class="d-name" id="sTitle">お店を追加</h2>
    <div id="sBody"></div>
  </div>
</section>

<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>
